# 远程部署：拉取 GHCR 预构建镜像（backend FastAPI + frontend Nuxt SSR）。
# 用法：
#   cp .env.example .env   # 填入 DB_PASSWORD
#   docker compose up -d
#   docker compose exec backend python -m scripts.create_api_key my-crawler
#   docker compose exec backend python -m scripts.seed_from_pdf   # 可选：演示数据

x-log: &json-log
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16-bookworm
    environment:
      POSTGRES_DB: agrihot
      POSTGRES_USER: agrihot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrihot -d agrihot"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *json-log
    restart: unless-stopped

  backend:
    image: ghcr.io/zuoa/agrihot-backend:latest
    logging: *json-log
    environment:
      AGRIHOT_PROCESS: api
      DATABASE_URL: postgresql+asyncpg://agrihot:${DB_PASSWORD}@db:5432/agrihot
      SITE_URL: ${SITE_URL:-https://agrihot.com}
      CORS_ORIGINS: "*"
      INGEST_RATE_LIMIT: 60/minute
      AGENT_RATE_LIMIT: ${AGENT_RATE_LIMIT:-60/minute}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-15}
      EMBEDDING_MIN_INTERVAL: ${EMBEDDING_MIN_INTERVAL:-1}
      EMBEDDING_RATE_LIMIT_COOLDOWN: ${EMBEDDING_RATE_LIMIT_COOLDOWN:-60}
      SEARCH_INDEX_ENABLED: ${SEARCH_INDEX_ENABLED:-true}
      # 自动精选评分（DeepSeek）；不设置 DEEPSEEK_API_KEY 则新条目一律不进精选
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SELECTION_THRESHOLD: ${SELECTION_THRESHOLD:-70}
      # 管理控制台密码；不设置则管理接口关闭（页面「管理」按钮无法登录）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 原文多策略获取；Jina Reader 兜底，API Key 可选
      CONTENT_FETCH_ENABLED: ${CONTENT_FETCH_ENABLED:-true}
      CONTENT_FETCH_TIMEOUT: ${CONTENT_FETCH_TIMEOUT:-60}
      CONTENT_MAX_CHARS: ${CONTENT_MAX_CHARS:-100000}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # 每日日报定时生成（时刻与「收录日期」日界都按 DAILY_TIMEZONE 业务时区，
      # 与容器系统时区无关；TZ 仅影响日志时间戳）
      TZ: Asia/Shanghai
      DAILY_GENERATE_ENABLED: ${DAILY_GENERATE_ENABLED:-true}
      DAILY_GENERATE_TIME: ${DAILY_GENERATE_TIME:-20:00}
      DAILY_TIMEZONE: ${DAILY_TIMEZONE:-Asia/Shanghai}
      # OpenAlex 文献雷达（免费元数据；OPENALEX_API_KEY 可选，有 key 速率更高）
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-ijedyu@gmail.com}
      LITERATURE_FETCH_ENABLED: ${LITERATURE_FETCH_ENABLED:-true}
      LITERATURE_FETCH_TIME: ${LITERATURE_FETCH_TIME:-07:30}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    image: ghcr.io/zuoa/agrihot-backend:latest
    logging: *json-log
    command: ["python", "-m", "app.services.content_worker"]
    environment:
      AGRIHOT_PROCESS: worker
      DATABASE_URL: postgresql+asyncpg://agrihot:${DB_PASSWORD}@db:5432/agrihot
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SELECTION_THRESHOLD: ${SELECTION_THRESHOLD:-70}
      DAILY_TOP_N: ${DAILY_TOP_N:-5}
      DAILY_TIMEZONE: ${DAILY_TIMEZONE:-Asia/Shanghai}
      CONTENT_FETCH_ENABLED: ${CONTENT_FETCH_ENABLED:-true}
      CONTENT_FETCH_TIMEOUT: ${CONTENT_FETCH_TIMEOUT:-60}
      CONTENT_MAX_CHARS: ${CONTENT_MAX_CHARS:-100000}
      JINA_API_KEY: ${JINA_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-15}
      EMBEDDING_MIN_INTERVAL: ${EMBEDDING_MIN_INTERVAL:-1}
      EMBEDDING_RATE_LIMIT_COOLDOWN: ${EMBEDDING_RATE_LIMIT_COOLDOWN:-60}
      SEARCH_INDEX_ENABLED: ${SEARCH_INDEX_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/zuoa/agrihot-frontend:latest
    logging: *json-log
    environment:
      NUXT_API_BASE: http://backend:8000
      NUXT_PUBLIC_SITE_URL: ${SITE_URL:-https://agrihot.com}
      NUXT_WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      NUXT_WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    ports:
      - "5820:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
