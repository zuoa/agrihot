# 远程部署：全部使用 Docker Hub 上的预构建镜像（zuoa/agrihot-*）。
# 用法：
#   cp .env.example .env   # 填入 DB_PASSWORD
#   docker compose up -d
#   docker compose exec backend python -m scripts.create_api_key my-crawler
#   docker compose exec backend python -m scripts.seed_from_pdf   # 可选：演示数据

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrihot
      POSTGRES_USER: agrihot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrihot -d agrihot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/zuoa/agrihot-backend:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://agrihot:${DB_PASSWORD}@db:5432/agrihot
      CORS_ORIGINS: "*"
      INGEST_RATE_LIMIT: 60/minute
      # 自动精选评分（DeepSeek）；不设置 DEEPSEEK_API_KEY 则新条目一律不进精选
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SELECTION_THRESHOLD: ${SELECTION_THRESHOLD:-70}
      # 管理控制台密码；不设置则管理接口关闭（页面「管理」按钮无法登录）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 全文兜底抓取（Jina Reader）；JINA_API_KEY 可选，匿名额度有限
      CONTENT_FETCH_ENABLED: ${CONTENT_FETCH_ENABLED:-true}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # 每日日报定时生成（时刻与「收录日期」日界都按 DAILY_TIMEZONE 业务时区，
      # 与容器系统时区无关；TZ 仅影响日志时间戳）
      TZ: Asia/Shanghai
      DAILY_GENERATE_ENABLED: ${DAILY_GENERATE_ENABLED:-true}
      DAILY_GENERATE_TIME: ${DAILY_GENERATE_TIME:-20:00}
      DAILY_TIMEZONE: ${DAILY_TIMEZONE:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ghcr.io/zuoa/agrihot-frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
