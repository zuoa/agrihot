map $http_user_agent $is_crawler {
    default 0;
    ~*(?i)(googlebot|google-inspectiontool|storebot-google|googleother|bingbot|bingpreview|baiduspider|sogou|360spider|bytespider|yisouspider|petalbot|duckduckbot|yandex(bot|images)|applebot|facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|whatsapp|telegrambot|discordbot|ia_archiver|semrushbot|ahrefsbot|dotbot|rogerbot|embedly|outbrain|pinterest|redditbot|showyoubot|quora\ link\ preview|vkshare|w3c_validator|flipboard|nuzzel|qwantify|bitrix\ link\ preview|xing-contenttabreceiver|chrome-lighthouse|yeti|naverbot|windowswechat|wxworkbot|dingtalkbot) 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # backend API + OpenAPI docs
    location ~ ^/(api|docs|openapi.json|redoc) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /og-image.png {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /apple-touch-icon.png {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # crawler HTML snapshots for public content URLs
    location ~ ^/(items|dailies|tags|feed|about|agent)(/|$) {
        error_page 418 = @crawler;
        if ($is_crawler) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location = / {
        error_page 418 = @crawler;
        if ($is_crawler) {
            return 418;
        }
        try_files /index.html =404;
    }

    location @crawler {
        proxy_pass http://backend:8000/seo$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
    }

    # SPA history routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
